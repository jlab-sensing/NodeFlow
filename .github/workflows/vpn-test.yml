name: Test WireGuard & SSH Connectivity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vpn-and-ssh:
    name: Test WireGuard & SSH Connectivity
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'production' || 'development' }}
    timeout-minutes: 10

    env:
      WG_CONFIG: ${{ secrets.WG_CONFIG }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      - name: Set up WireGuard
        run: |
          sudo apt-get update
          sudo apt install -y resolvconf wireguard
          sudo apparmor_parser -R /etc/apparmor.d/wg-quick 2>/dev/null || true

          # Allow systemd-resolved to forward single-label hostnames to unicast DNS
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf "[Resolve]\nResolveUnicastSingleLabel=yes\n" | sudo tee /etc/systemd/resolved.conf.d/single-label.conf
          sudo systemctl restart systemd-resolved

          sudo mkdir -p /etc/wireguard
          echo "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

          echo "=== WireGuard Configuration File ==="
          sudo sed 's/PrivateKey.*/PrivateKey = [REDACTED]/' /etc/wireguard/wg0.conf

          sudo wg-quick up wg0

          # Prevent default cloud search domain on eth0 from overriding VPN DNS lookups
          sudo resolvectl domain eth0 "" 2>/dev/null || true
          sudo resolvectl domain wg0 "~." 2>/dev/null || true
          sudo resolvectl default-route wg0 true 2>/dev/null || true

          echo "=== WireGuard Active Configuration ==="
          sudo wg show

          echo "=== IP Address ==="
          ip addr

          echo "=== IP Route ==="
          ip route

      - name: Wait for Interface and Test Connectivity
        run: |
          echo "Waiting for WireGuard interface and handshake..."
          for i in $(seq 1 15); do
            ping -c 1 -W 1 192.168.18.2 >/dev/null 2>&1 || true

            HANDSHAKE=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            if [ -n "$HANDSHAKE" ] && [ "$HANDSHAKE" -gt 0 ] 2>/dev/null; then
              echo "WireGuard tunnel is online (handshake established at timestamp $HANDSHAKE)."
              break
            fi
            echo "Waiting for WireGuard handshake ($i/15)..."
            sleep 1
          done

          echo "=== WireGuard Status Before Ping ==="
          sudo wg show

          echo "=== Testing Ping to 192.168.18.2 ==="
          ping -c 4 192.168.18.2 || {
            echo "=== WireGuard Status After Ping Attempt ==="
            sudo wg show
            exit 1
          }

      - name: Check DNS Configuration
        run: |
          echo "=== DNS Configuration (/etc/resolv.conf) ==="
          cat /etc/resolv.conf

          echo "=== systemd-resolved Status for wg0 ==="
          resolvectl status wg0 || true

          echo "=== Querying DNS for $SSH_HOST via wg0 ==="
          resolvectl query -i wg0 "$SSH_HOST" || true

          echo "=== Testing System Resolution (getent) for $SSH_HOST ==="
          if getent hosts "$SSH_HOST"; then
            echo "System resolver successfully resolved $SSH_HOST."
          else
            echo "Error: Unable to resolve $SSH_HOST"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Connect via SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "hostname && whoami"

      - name: Teardown WireGuard
        if: always()
        run: |
          sudo wg-quick down wg0 || true
