services: 

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    image: nodeflow-backend
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - '8001:8001'
    depends_on:
      - postgresql
    volumes: 
      - './backend:/app'
    
  frontend: 
    build: 
      context: ./frontend
      dockerfile: ./Dockerfile
    image: nodeflow-frontend
    env_file: 
      - ${ENV_FILE:-.env}
    ports:
      - '3001:81'
    depends_on: 
      - backend
    tty: true
    volumes: 
      - './frontend/src:/app/src'

  postgresql:
    image: postgres:16
    environment: 
      POSTGRES_DB: nodeflow
      POSTGRES_USER: nodeflow
      POSTGRES_PASSWORD: nf_password  
    ports: 
      - '5433:5432'
    volumes: 
      - postgresql-16-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - '8889:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    
volumes:
  postgresql-16-data:
  pgadmin-data: